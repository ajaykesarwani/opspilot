name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"
        
    - name: Install dependencies
      run: uv sync
        
    - name: Lint and Format
      run: |
        uv run ruff check .
        uv run ruff format --check .
        
    - name: Unit Tests (Fast)
      run: uv run pytest -m "not integration"
        
    - name: Evaluation Suite (Mock Mode)
      run: uv run python services/evaluation/opspilot_evaluation/run_eval.py
