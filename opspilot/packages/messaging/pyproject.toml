[project]
name = "opspilot-messaging"
version = "0.1.0"
description = "Messaging interfaces and implementations for OpsPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.5.3",
    "pydantic>=2.8",
    "opspilot-contracts",
    "opspilot-common",
    "opentelemetry-api>=1.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_messaging"]
