[project]
name = "opspilot-rag"
version = "0.1.0"
description = "RAG components for OpsPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.5.0",
    "pydantic>=2.8",
    "opspilot-contracts",
    "opspilot-common"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_rag"]
