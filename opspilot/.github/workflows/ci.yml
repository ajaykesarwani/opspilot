name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REQUIRE_DB_TESTS: "1" # fail (not skip) if PostgreSQL is unreachable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify lockfile is up to date
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing:skip-covered
      - name: Integration tests (real PostgreSQL + Alembic migrations)
        run: uv run pytest -m integration
      - name: Evaluation regression gate
        run: uv run python services/evaluation/opspilot_evaluation/run_eval.py --check --no-mlflow

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config -q
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t opspilot-api .
      - name: Build worker image
        run: docker build -f services/worker/Dockerfile -t opspilot-worker .
      - name: Worker image can import its dependencies
        run: docker run --rm opspilot-worker python -c "import opspilot_worker.main"
      - name: API image can import its dependencies
        run: docker run --rm opspilot-api python -c "import opspilot_api.main"
      - name: Build UI image
        run: docker build -t opspilot-ui apps/frontend
