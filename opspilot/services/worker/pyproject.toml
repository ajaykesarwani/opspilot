[project]
name = "opspilot-worker"
version = "0.1.0"
description = "Worker service for OpsPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opspilot-contracts",
    "opspilot-common",
    "opspilot-persistence",
    "opspilot-messaging",
    "opspilot-rag",
    "opspilot-orchestration",
    "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_worker"]

[tool.uv.sources]
opspilot-contracts = { workspace = true }
opspilot-common = { workspace = true }
opspilot-persistence = { workspace = true }
opspilot-messaging = { workspace = true }
opspilot-rag = { workspace = true }
opspilot-orchestration = { workspace = true }
