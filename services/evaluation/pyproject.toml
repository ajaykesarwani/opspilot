[project]
name = "opspilot-evaluation"
version = "0.1.0"
description = "Evaluation service for OpsPilot using MLflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=2.11.0",
    "pandas>=2.0.0",
    "opspilot-common",
    "opspilot-contracts",
    "opspilot-rag",
    "opspilot-orchestration"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_evaluation"]
