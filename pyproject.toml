[project]
name = "opspilot"
version = "0.1.0"
description = "OpsPilot: Observable AI Workflow Platform (production-style portfolio project)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
# Virtual workspace root: depends on every member so `uv sync` installs them all.
dependencies = [
    "opspilot-api",
    "opspilot-worker",
    "opspilot-common",
    "opspilot-contracts",
    "opspilot-persistence",
    "opspilot-messaging",
    "opspilot-rag",
    "opspilot-orchestration",
    "opspilot-evaluation"
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/api", "services/worker", "services/evaluation"]

[tool.uv.sources]
opspilot-api = { workspace = true }
opspilot-worker = { workspace = true }
opspilot-common = { workspace = true }
opspilot-contracts = { workspace = true }
opspilot-persistence = { workspace = true }
opspilot-messaging = { workspace = true }
opspilot-rag = { workspace = true }
opspilot-orchestration = { workspace = true }
opspilot-evaluation = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
addopts = "-ra --import-mode=importlib"
markers = ["integration: requires reachable PostgreSQL and/or Kafka (see README)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "opspilot_api",
    "opspilot_worker",
    "opspilot_common",
    "opspilot_contracts",
    "opspilot_persistence",
    "opspilot_messaging",
]
