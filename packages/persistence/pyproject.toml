[project]
name = "opspilot-persistence"
version = "0.1.0"
description = "PostgreSQL models, repositories, outbox and Alembic migrations for OpsPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "opspilot-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_persistence"]

[tool.uv.sources]
opspilot-contracts = { workspace = true }
