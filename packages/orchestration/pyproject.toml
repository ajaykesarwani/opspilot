[project]
name = "opspilot-orchestration"
version = "0.1.0"
description = "LangGraph workflow orchestration for OpsPilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.8",
    "opspilot-contracts",
    "opspilot-common",
    "opspilot-rag"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_orchestration"]
