[project]
name = "opspilot-contracts"
version = "0.1.0"
description = "Typed request/response/event contracts shared across OpsPilot services"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opspilot_contracts"]
